name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
      - name: Shellcheck
        run: shellcheck -S warning install.sh uninstall.sh tests/run.sh bin/lumenparty bin/wol wol/lib.sh wol/models.sh wol/spells/*.sh wol/crystal/*.sh bench/run.sh bench/tasks/*/check.sh
      - name: Generated files are up to date
        run: |
          python3 tools/gen_agents.py && python3 tools/gen_skills.py
          git diff --exit-code -- agents skills
      - name: Spell tests
        run: tests/run.sh
      - name: Benchmark plumbing (no Claude calls)
        run: bench/run.sh --dry
